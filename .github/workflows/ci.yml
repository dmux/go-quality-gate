name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Download dependencies
              run: go mod download

            - name: Format check
              run: |
                  if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
                    echo "Code is not formatted properly:"
                    gofmt -s -l .
                    exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Run tests
              run: make test-coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.out
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Download dependencies
              run: go mod download

            - name: Build for current platform
              run: make build

            - name: Test binary
              run: ./quality-gate -v

    smoke-native-os:
        name: Native smoke (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        needs: test
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Build native binary
              run: go build -o quality-gate ./cmd/quality-gate

            - name: Smoke test against a throwaway fixture
              shell: bash
              run: |
                  BIN="$(pwd)/quality-gate"
                  [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"

                  WORKDIR="$(mktemp -d)"
                  cd "$WORKDIR"
                  git init -q

                  "$BIN" --init < /dev/null
                  "$BIN" doctor || true

                  printf 'settings:\n  tools_policy: recommend\ntools: []\nhooks:\n  sample:\n    pre-commit:\n      - name: "Go version check"\n        command: "go version"\n' > quality.yml

                  "$BIN" pre-commit

    e2e-linux-distros:
        name: E2E (Linux distros)
        runs-on: ubuntu-latest
        needs: test

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Download dependencies
              run: go mod download

            - name: Run multi-distro E2E suite
              run: make test-e2e
